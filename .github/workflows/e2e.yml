# The check that `main` requires before a PR can merge.
#
# The job name below ("verify") is what gets selected as a required status
# check in the branch protection rule — renaming it silently detaches the
# protection, so keep it stable.
name: e2e

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# A force-push or rapid follow-up commit should cancel the superseded run
# rather than queue behind it.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Guards the loader contract: `src/lib/image-variants.ts` is generated,
      # and a committed copy that disagrees with the sources would let the
      # loader emit URLs for files that were never written.
      #
      # Compares the generated manifest byte-for-byte (it is plain text, and
      # deterministic) but `public/img` only by which files exist. Image
      # encoders are NOT byte-reproducible across platforms — the same og.png
      # comes out 118939 bytes from sharp on Windows and 118473 on this
      # runner — so comparing content here fails on every PR regardless of
      # whether anything is actually stale.
      - name: Image variants are in sync
        run: |
          npm run images

          git diff --exit-code -- src/lib/image-variants.ts \
            || { echo "::error::src/lib/image-variants.ts is stale — run 'npm run images' and commit it"; exit 1; }

          git add -A public/img
          MISSING=$(git diff --cached --name-status -- public/img | grep -E '^[AD]' || true)
          if [ -n "$MISSING" ]; then
            echo "::error::public/img is missing files the generator produces — run 'npm run images' and commit the result"
            echo "$MISSING"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
